<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小红书旅行攻略</title>
    <link rel="stylesheet" href="/xiaohongshu.css" />
  </head>
  <body>
    <main>
      <a class="back" href="/">← 返回 Demo 首页</a>
      <header>
        <p class="eyebrow">READ-ONLY XIAOHONGSHU GUIDE</p>
        <h1>生成旅行攻略</h1>
        <p>输入目的地，服务会搜索小红书帖子、保存原始结果，并生成可直接打开的 HTML 攻略。</p>
      </header>
      <form id="guide-form">
        <label for="destination">目的地</label>
        <div class="row"><input id="destination" name="destination" value="香格里拉" maxlength="60" required autofocus /><button id="generate" type="submit">生成攻略</button></div>
        <p class="hint">只读取登录状态、搜索结果与帖子详情；不会发布、评论、点赞或收藏。首次生成约需 1–4 分钟，请勿关闭此页面。</p>
      </form>
      <form id="travel-plan-form">
        <label for="plan-origin">出发地</label>
        <input id="plan-origin" name="origin" value="北京" maxlength="40" />
        <label for="plan-destination">目的地（可填写多个城市，用“、”分隔）</label>
        <input id="plan-destination" name="destination" value="香格里拉、丽江" maxlength="80" required />
        <div class="date-row"><label>开始日期<input id="plan-start" type="date" value="2026-10-02" required /></label><label>结束日期<input id="plan-end" type="date" value="2026-10-07" required /></label></div>
        <div class="plan-actions"><button id="generate-plan" type="submit">生成完整路线规划</button></div>
        <p class="hint">先聚合小红书多帖推荐，再查询携程交通和酒店，并使用高德验证 POI 与每天的逐段路线。</p>
      </form>
      <section id="result" class="result" aria-live="polite"><p>准备就绪。</p></section>
      <section class="rules">
        <h2>图片规则</h2>
        <p>景点图片必须能追溯到提及该地点的小红书来源帖子；未做图像语义核验的图片会明确标注为“来源帖配图”。</p>
      </section>
    </main>
    <script src="/xiaohongshu.js"></script>
  </body>
</html>
