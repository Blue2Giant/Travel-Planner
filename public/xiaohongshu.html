<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小红书旅行攻略</title>
    <link rel="stylesheet" href="/xiaohongshu.css" />
  </head>
  <body>
    <main>
      <a class="back" href="/">← 返回 Demo 首页</a>
      <header>
        <p class="eyebrow">READ-ONLY XIAOHONGSHU GUIDE</p>
        <h1>生成旅行攻略</h1>
        <p>输入目的地，服务会搜索小红书帖子、保存原始结果，并生成可直接打开的 HTML 攻略。</p>
      </header>
      <form id="guide-form">
        <label for="destination">目的地</label>
        <div class="row"><input id="destination" name="destination" value="香格里拉" maxlength="60" required autofocus /><button id="generate" type="submit">生成攻略</button></div>
        <p class="hint">只读取登录状态、搜索结果与帖子详情；不会发布、评论、点赞或收藏。首次生成约需 1–4 分钟，请勿关闭此页面。</p>
      </form>
      <section id="result" class="result" aria-live="polite"><p>准备就绪。</p></section>
      <section class="rules">
        <h2>图片规则</h2>
        <p>系统不会自动把一篇帖子的图片配到多个景点。只有已人工核对且带说明的条目级图片才会进入最终攻略；自动检索生成的未核验条目只展示文字和原帖链接。</p>
      </section>
    </main>
    <script src="/xiaohongshu.js"></script>
  </body>
</html>
